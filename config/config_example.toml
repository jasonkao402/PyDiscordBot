[discord_bot]
debug_channel_id = -1
debug_guild_id = -1
activity = "正在殺蟲...(debugging...)"
directory = "./cog"
preload = [
    "mainbot",
    "latex_render",
    "llm_admin",
    "llm_chat",
    "persona_manager",
]

[webui]
host = "localhost"
port = 8070

[llm_model]
provider_llm = "deepseek"
provider_jev = "local_jev"
model_main = "deepseek/deepseek-v4.1-flash-1017"
model_debug = "deepseek/deepseek-v4.1-flash-1017"
model_jev = "jev-latest"
model_embed = "shaw/dmeta-embedding-zh"
max_tokens = 5120
detail_memory_range = 14
summary_memory_range = 14
retrieval_memory_range = 3
round_robin_quota = 50 # Number of requests before switching to the next API key

[prompt_template]
memory_request = "可以幫忙依照時間順序整理一下剛剛在聊什麼嗎？保留大綱即可，省略不重要的零碎小事。"
memory_format = """
<記憶格式>
使用json格式，每則記錄一定要記錄到下列 key & value，並且嚴格遵守格式。
"event_id": 從1遞增的整數(int)
"what": 要記憶的互動或事件(string)
"who": 互動或事件的參與者名字(string)

備註:"when"已幫你記住，記得遵守上述json格式。
</記憶格式>
"""
reply_format = """
<回答格式> 使用json格式，每次回覆使用者一定要記錄到下列 key & value，並且嚴格遵守格式。
"what_to_reply" : 要回答的實際內容(string)
"delta_affection" : 對使用者的好感度變化，範圍從 -3 到 +3(int)
</回答格式>
"""

[stablediffusion]
promptNeg = "(lowres:1.2), EasyNegative, badhandv4, negative_hand-neg, (worst quality:1.4), (low quality:1.4), (bad anatomy:1.4), bad hands, multiple views, comic, jpeg artifacts, bad feet, text, error, missing fingers, extra digits, fewer digits, cropped, signature, watermark, username, blurry"

[auth]
admin_list = [
]
channel_list = [
]
ban_list = [
]

[api_token]
discord = "EXAMPLE_DISCORD_TOKEN"
[api_token.deepseek]
url = "https://api.deepseek.com"
keys = [
    "EXAMPLE_DEEPSEEK_API_KEY",
]
[api_token.openrouter]
url = "https://openrouter.ai/api/v1"
keys = [
    "EXAMPLE_OPENROUTER_API_KEY",
]
[api_token.jev]
url = "https://api.typesafe.ai/v1/systemone"
keys = [
    "EXAMPLE_JEV_API_KEY",
]
[api_token.jev_local]
url = "http://localhost/v1/systemone"
keys = [
    "EXAMPLE_JEV_LOCAL_API_KEY",
]
