line-length = 120
target-version = "py314"


[lint]
preview = true
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "ANN",
  "ASYNC",
  "S",
  "B",
  "A",
  "C4",
  "DTZ",
  "EM",
  "FA",
  "ISC",
  "LOG",
  "G",
  "PIE",
  "T20",
  "PT",
  "RSE",
  "RET",
  "SLOT",
  "SIM",
  "TC",
  "ARG",
  "PTH",
  "PL",
  "TRY",
  "FAST",
  "PERF",
  "FURB",
  "RUF",
]
ignore = [
  "print",    # Print statement used
  "assert",    # Assert used
  "blank-lines-top-level",  # Blank lines at top level
  "used-dummy-variable",  # used dummy variable used
  "hardcoded-sql-expression",
  "magic-value-comparison", # Magic value used
  "ambiguous-unicode-character-comment",  # Comment contains ambiguous character
  "no-self-use", # Method could be a function, class method, or static method
  "any-type",  # typing.Any used
  "non-lowercase-variable-in-function",  # Non-lowercase variable in function
  "call-datetime-strptime-without-zone",  # Naive datetime constructed
  "ambiguous-unicode-character-string",  # Ambiguous characters (e.g. full-width parens)
  "ambiguous-unicode-character-docstring",  # Docstring contains ambiguous character
  "whitespace-after-open-bracket",  # Whitespace after open bracket
  "whitespace-before-close-bracket",  # Whitespace before close bracket
  
  # Custom ignores for this project
  "line-too-long",  # Line too long
  "asyncio-dangling-task",  # Store a reference to the return value of asyncio.create_task
  "too-many-arguments", # Too many arguments in function definition
  "too-many-positional-arguments", # Too many positional arguments
  "too-many-public-methods", # Too many public methods
  "raise-within-try",  # Abstract raise to an inner function
  "implicit-return",  # Missing explicit return statements
  "suspicious-non-cryptographic-random-usage",    # Cryptographically weak pseudo-random number generator used
  "suspicious-pickle-usage",    # pickle module used
  "suspicious-pickle-import",    # pickle module used
  "ambiguous-variable-name",    # Ambiguous variable name
  "missing-type-args",  # Missing type annotation for *args
  "missing-type-kwargs",  # Missing type annotation for **kwargs
  "missing-return-type-special-method",  # Missing return type for special method
  "missing-return-type-undocumented-public-function",  # Missing return type for undocumented public function

  # Refactor related ignores
  "complex-structure",    # Function is too complex
  "too-many-locals", # Too many local variables
  "too-many-statements", # Too many statements
  "too-many-branches", # Too many branches
  "too-many-return-statements", # Too many return statements
]

[lint.per-file-ignores]
"**/__init__.py" = ["undefined-local-with-import-star", "unused-import"]
"./migrations/*.py" = ["ALL"]
"test_*.py" = ["ALL"]
"test.py" = ["ALL"]
"restart.py" = ["print", "subprocess-popen-with-shell-equals-true", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]

[lint.flake8-type-checking]
quote-annotations = true
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "pydantic_settings.BaseSettings",
]
runtime-evaluated-decorators = [
  "discord.ext.commands.command",
  "discord.app_commands.command",
]

[lint.mccabe]
max-complexity = 15

[lint.pydocstyle]
convention = "google"

[lint.isort]
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[format]
skip-magic-trailing-comma = true
